
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <title>P.A.R.K.E.R.</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle, #17263d, #080d18 70%);
      color: #eaf3ff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      letter-spacing: 7px;
      font-size: 25px;
      font-weight: 400;
      z-index: 2;
    }

    .emblem {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(85vw, 1100px);
      z-index: 1;
    }

    .emblem img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    #parker-conversation {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 650px);
  max-height: 45vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 10px;
  z-index: 10;
  color: white;
}

.chat-message {
  padding: 12px 16px;
  border-radius: 12px;
  max-width: 85%;
  overflow-wrap: anywhere;
}

.user-message {
  align-self: flex-end;
  background: #315d91;
}

.parker-message {
  align-self: flex-start;
  background: #17263d;
  border: 1px solid #52647d;
}
    #parker-chat {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 650px);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    #parker-message {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #52647d;
      background: #101a2b;
      color: white;
      font-size: 16px;
    }

    #parker-send {
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
      background: #315d91;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #parker-response {
      position: absolute;
      bottom: 65px;
      left: 0;
      width: 100%;
      color: white;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>P.A.R.K.E.R.</h1>

  <div class="emblem">
    <img src="Futuristic Chrome P Emblem.png" alt="Parker emblem">
  </div>

<div id="parker-conversation"></div>

<div id="parker-chat">
  <input id="parker-message" type="text" placeholder="Talk to Parker...">
  <button id="parker-send">Send</button>
</div>
  <script>
   const parkerInput = document.getElementById("parker-message");
const parkerSend = document.getElementById("parker-send");
const parkerConversation = document.getElementById("parker-conversation");

function sendMessage() {
  const message = parkerInput.value.trim();

  if (!message) return;

  const userMessage = document.createElement("div");
  userMessage.className = "chat-message user-message";
  userMessage.textContent = message;

  parkerConversation.appendChild(userMessage);

  const parkerReply = document.createElement("div");
  parkerReply.className = "chat-message parker-message";
  parkerReply.textContent = "Parker received: " + message;

  parkerConversation.appendChild(parkerReply);

  parkerInput.value = "";
  parkerConversation.scrollTop = parkerConversation.scrollHeight;
}

parkerSend.addEventListener("click", sendMessage);

parkerInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
  </script>

</body>
</html>
