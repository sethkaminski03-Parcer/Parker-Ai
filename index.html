<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <title>Parker AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #17263d, #080d18 70%);
      color: #eaf3ff;
      font-family: Arial, sans-serif;
    }

    h1 {
      position: absolute;
      top: 35px;
      letter-spacing: 9px;
      font-size: 25px;
      font-weight: 400;
    }

    .emblem {
      width: 190px;
      height: 190px;
      border: 2px solid #8da9c9;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 0 35px #2675bd55, inset 0 0 30px #2675bd33;
      background: linear-gradient(145deg, #263b55, #080d18);
    }

    .emblem span {
      font-size: 105px;
      font-weight: bold;
      color: #c9d9eb;
      text-shadow: 0 0 20px #4c9de8;
    }

    button {
      margin-top: 55px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 1px solid #8ab9ed;
      background: linear-gradient(145deg, #285b8c, #10243d);
      color: white;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px #2789df66;
    }

    p {
      color: #91a8c3;
      letter-spacing: 3px;
      font-size: 11px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>PARKER</h1>
  <div class="emblem"><span>P</span></div>
  <button aria-label="Voice button">🎙</button>
  <p>PERSONAL AI ASSISTANT</p>
</body>
</html>
