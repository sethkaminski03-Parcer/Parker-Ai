
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <title>P.A.R.K.E.R.</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle, #17263d, #080d18 70%);
      color: #eaf3ff;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 45px;
      letter-spacing: 7px;
      font-size: 25px;
      font-weight: 400;
    }

.emblem {
  position: absolute;
  top: 56%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(96vw, 1200px);
  height: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.emblem img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}
  </style>
</head>
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<body>
  <h1>P.A.R.K.E.R.</h1>
  <div class="emblem">
  <img src="Futuristic Chrome P Emblem.png" alt="Parker emblem">
</div>
</body>
</html>
